<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f7f7f3" />
  <title>BoardScoring</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <img src="icon.svg" alt="" class="brand-icon" />
        <div>
          <h1>BoardScoring</h1>
          <p class="subtitle" id="gameSubtitle">Nouvelle partie</p>
        </div>
      </div>
      <button class="icon-btn" id="newGameBtn" aria-label="Nouvelle partie" title="Nouvelle partie">↻</button>
    </header>

    <section class="setup card" id="setupPanel">
      <h2>Créer une partie</h2>
      <label class="field-label" for="gameName">Nom du jeu <span>(facultatif)</span></label>
      <input id="gameName" class="text-input" type="text" placeholder="Ex. Belote, 7 Wonders…" maxlength="40" />

      <div class="section-row">
        <h3>Joueurs</h3>
        <span id="playerCount">2 / 8</span>
      </div>
      <div id="playersSetup" class="players-setup"></div>
      <button class="secondary-btn" id="addPlayerBtn">＋ Ajouter un joueur</button>

      <div class="winner-mode">
        <span class="field-label">Condition de victoire</span>
        <label><input type="radio" name="winnerMode" value="high" checked /> Le score le plus élevé gagne</label>
        <label><input type="radio" name="winnerMode" value="low" /> Le score le plus faible gagne</label>
      </div>

      <button class="primary-btn" id="startGameBtn">Commencer la partie</button>
    </section>

    <section id="gamePanel" class="game-panel hidden">
      <section class="summary card">
        <div>
          <div class="eyebrow">Partie en cours</div>
          <h2 id="gameTitle">Partie</h2>
        </div>
        <div class="summary-actions">
          <button class="small-btn" id="undoBtn" disabled>↶ Annuler</button>
          <button class="small-btn danger-text" id="resetBtn">Réinitialiser</button>
        </div>
      </section>

      <section class="score-wrap card">
        <div class="score-scroll" id="scoreScroll">
          <table class="score-table" id="scoreTable"></table>
        </div>
      </section>

      <button class="primary-btn sticky-add" id="addRoundBtn">＋ Ajouter une manche</button>
    </section>
  </main>

  <dialog id="scoreDialog" class="score-dialog">
    <form method="dialog" class="dialog-card" id="scoreForm">
      <button type="button" class="close-btn" id="closeDialogBtn" aria-label="Fermer">×</button>
      <div class="dialog-heading">
        <h2 id="dialogTitle">Joueur · Manche 1</h2>
        <p>Modifier le score de cette manche</p>
      </div>

      <div class="score-stepper">
        <button type="button" class="round-btn" data-delta="-1">−</button>
        <button type="button" id="scoreValueButton" class="score-value">0</button>
        <button type="button" class="round-btn" data-delta="1">＋</button>
      </div>

      <div class="quick-grid">
        <button type="button" data-delta="-10">−10</button>
        <button type="button" data-delta="-5">−5</button>
        <button type="button" data-delta="5">＋5</button>
        <button type="button" data-delta="10">＋10</button>
      </div>

      <div id="manualEntry" class="manual-entry hidden">
        <input id="manualScoreInput" type="number" inputmode="numeric" step="1" />
        <button type="button" class="small-btn" id="applyManualBtn">Valider</button>
      </div>

      <button type="button" class="primary-btn" id="manualEntryBtn">Saisir une valeur</button>
      <button type="submit" class="secondary-btn">Terminer</button>
    </form>
  </dialog>

  <script src="app.js" defer></script>
</body>
</html>
